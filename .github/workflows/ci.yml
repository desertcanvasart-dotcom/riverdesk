name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs, e.g. the 10-consecutive-runs flake check for concurrency tests.
  workflow_dispatch:

# Read-only token: CI checks code, it never writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'push' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      # Actions pinned to commits (tags can be moved); the tag is noted beside each.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Known vulnerabilities in what ships (high and critical fail the run).
      - run: pnpm audit --prod --audit-level high

      # The worker renders PDFs and PNGs with headless Chromium; its tests render real documents.
      - name: Install Chromium for document rendering
        run: pnpm --filter @vs/worker exec playwright install --with-deps chromium

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.111.0

      - name: Start local Supabase
        run: pnpm supabase:start

      - name: Configure for the local stack
        run: cp .env.example .env && echo "VS_ENV=ci" >> .env

      - name: Migrate (twice, to prove it is idempotent) and seed
        run: pnpm db:migrate && pnpm db:migrate && pnpm db:seed

      - name: Generated database types are up to date
        run: pnpm db:codegen && git diff --exit-code packages/db/src/generated

      - name: Generated API types match openapi.yaml
        run: pnpm --filter @vs/contracts generate:api && git diff --exit-code packages/contracts/src/generated

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # The images Railway builds, built here first, so a broken Dockerfile fails CI, not a deploy.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [api, backoffice, website, worker]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -f deploy/${{ matrix.app }}.Dockerfile -t riverdesk-${{ matrix.app }} .
      - name: Runs as a non-root user
        run: test "$(docker run --rm --entrypoint id riverdesk-${{ matrix.app }} -un)" = node
