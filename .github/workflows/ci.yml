name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs, e.g. the 10-consecutive-runs flake check for concurrency tests.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'push' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Start local Supabase
        run: pnpm supabase:start

      - name: Configure for the local stack
        run: cp .env.example .env && echo "VS_ENV=ci" >> .env

      - name: Migrate (twice, to prove it is idempotent) and seed
        run: pnpm db:migrate && pnpm db:migrate && pnpm db:seed

      - name: Generated database types are up to date
        run: pnpm db:codegen && git diff --exit-code packages/db/src/generated

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
